<!DOCTYPE html>

<head>
    <meta charset="utf-8" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0X51EEE3QC"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-0X51EEE3QC');

    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Quark Suite | Blazor UI Components Inspired by shadcn/ui</title>
    <base href="/" />
    <script>
        (() => {
            let preference;
            try { preference = localStorage.getItem("quark-theme"); } catch { }
            const dark = preference === "dark" || (preference !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
            document.documentElement.classList.toggle("dark", dark);
            document.documentElement.style.colorScheme = dark ? "dark" : "light";
        })();
    </script>
    <link rel="icon" type="image/png" href="icon.png" />
    <script type="module">
        import { initialize } from "./_content/Soenneker.Quark.Suite/js/themeinterop.js";
        initialize();
    </script>
    <script>
        window.quarkDemo = {
            scrollPageToTop() {
                window.scrollTo({ top: 0, left: 0, behavior: "auto" });
            },
            scrollElementToTop(element) {
                if (element && typeof element.scrollTo === "function") {
                    element.scrollTo({ top: 0, left: 0, behavior: "auto" });
                }
            }
        };
    </script>
    <link href="css/quark-tailwind.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="Soenneker.Quark.Suite.Demo.styles.css" rel="stylesheet" />
</head>

<body>

</html>
