name: deploy-demo

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PipelineEnvironment: true
  NUGET_XMLDOC_MODE: skip
  UseLocalProjects: false

jobs:
  deploy-demo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          workloads: wasm-tools

      - name: Restore demo
        run: dotnet restore test/Soenneker.Quark.Suite.Demo/Soenneker.Quark.Suite.Demo.csproj --verbosity minimal

      - name: Publish Blazor WebAssembly demo
        run: >-
          dotnet publish test/Soenneker.Quark.Suite.Demo/Soenneker.Quark.Suite.Demo.csproj
          --configuration Release
          --no-restore
          --output artifacts/cloudflare-workers
          --verbosity minimal

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
